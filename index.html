<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>サロン サイネージ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Shippori+Mincho:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* --u = 画面の短い辺の1%、--vh/--vw = 表示面（回転後）の高さ・幅の1%。JSで設定 */
  :root { --u:1vh; --vh:1vh; --vw:1vw;
    --bg:#0d0c0b; --fg:#f3ede4; --gold:#d8bf8f; --gold2:#a88b5a; --muted:#a69d92; --line:rgba(216,191,143,.35); }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:100%; height:100%; overflow:hidden; background:#000; color:var(--fg); cursor:none;
    font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif; }
  #app { position:fixed; left:0; top:0; transform-origin:0 0; display:flex; flex-direction:column;
    background:radial-gradient(ellipse at 50% 30%, #2a2622 0%, var(--bg) 70%); }

  /* ===== 上：ウェルカムボード ===== */
  #welcome { height:calc(43 * var(--vh)); flex:none; padding:calc(2.5 * var(--u)); }
  body.portrait #welcome { height:calc(50 * var(--vh)); }
  /* 横置きは高さが足りないので小さめに */
  body:not(.portrait) .wtitle { font-size:calc(8 * var(--u)); }
  body:not(.portrait) .heart { margin:calc(.4 * var(--u)) 0; }
  body:not(.portrait) .guest { font-size:calc(3.6 * var(--u)); }
  .frame { position:relative; height:100%; border:1px solid var(--line); border-radius:calc(1.6 * var(--u));
    display:flex; flex-direction:column; align-items:center; text-align:center;
    padding:calc(3 * var(--u)) calc(3 * var(--u)) calc(2 * var(--u)); }
  .frame::before { content:""; position:absolute; inset:calc(.8 * var(--u)); border:1px solid rgba(216,191,143,.18);
    border-radius:calc(1.1 * var(--u)); pointer-events:none; }
  .wtitle { font-family:"Great Vibes",cursive; font-size:calc(11 * var(--u)); line-height:1; color:var(--gold);
    text-shadow:0 0 calc(2 * var(--u)) rgba(216,191,143,.25); }
  .wsub { font-size:calc(2.4 * var(--u)); letter-spacing:.45em; color:var(--fg); margin-top:calc(1.2 * var(--u)); }
  .heart { color:var(--gold2); font-size:calc(2 * var(--u)); margin:calc(1.2 * var(--u)) 0; }
  .wmsg { font-size:calc(2.3 * var(--u)); letter-spacing:.15em; color:var(--muted); }
  .guests { flex:1; width:100%; display:flex; flex-wrap:wrap; justify-content:center; align-content:center;
    gap:calc(1.6 * var(--u)) calc(3 * var(--u)); overflow:hidden; transition:opacity .8s; margin-top:calc(1.5 * var(--u)); }
  .guest { font-size:calc(4.6 * var(--u)); font-weight:600; letter-spacing:.1em; white-space:nowrap;
    padding:calc(.6 * var(--u)) calc(2 * var(--u)); border-bottom:1px solid var(--line); }
  .guest .sama { font-size:calc(2.6 * var(--u)); margin-left:.4em; color:var(--gold); font-weight:400; }
  .guest .time { font-size:calc(2.2 * var(--u)); margin-right:.8em; color:var(--gold); }
  .guest.next { border-bottom-color:var(--gold); }
  .noguest { font-size:calc(2.6 * var(--u)); color:var(--muted); letter-spacing:.15em; }
  .clock { position:absolute; right:calc(2.5 * var(--u)); top:calc(1.8 * var(--u)); font-size:calc(1.8 * var(--u));
    color:var(--muted); font-family:"Hiragino Sans",sans-serif; font-variant-numeric:tabular-nums; }

  /* ===== 下：広告（画像・文字・YouTube動画） ===== */
  #stage { flex:1; position:relative; overflow:hidden; background:#000; }
  .slide { position:absolute; inset:0; opacity:0; transition:opacity 1.2s ease; display:flex; align-items:flex-end; }
  .slide.on { opacity:1; }
  .slide .shade { position:absolute; inset:0; background:linear-gradient(0deg,rgba(0,0,0,.7),rgba(0,0,0,0) 60%); }
  .slide .inner { position:relative; width:100%; padding:0 calc(4 * var(--u)) calc(5 * var(--u)); }
  .slide h2 { font-size:calc(5.5 * var(--u)); line-height:1.3; margin-bottom:calc(1.4 * var(--u)); font-weight:600; }
  .slide p { font-size:calc(2.8 * var(--u)); line-height:1.7; white-space:pre-line; color:#ece3d6; }
  .slide.text { align-items:center; justify-content:center; text-align:center; }
  .slide.text h2 { color:var(--gold); }
  .slide iframe { position:absolute; inset:0; width:100%; height:100%; border:0; pointer-events:none; }
  .dots { position:absolute; right:calc(3 * var(--u)); bottom:calc(2 * var(--u)); display:flex; gap:calc(.8 * var(--u)); z-index:2; }
  .dots i { width:calc(1 * var(--u)); height:calc(1 * var(--u)); border-radius:50%; background:rgba(255,255,255,.3); }
  .dots i.on { background:var(--gold); }

  #ticker { height:calc(5.5 * var(--u)); flex:none; overflow:hidden; background:#000; border-top:1px solid var(--line);
    display:flex; align-items:center; }
  #ticker span { display:inline-block; white-space:nowrap; font-size:calc(2.5 * var(--u)); letter-spacing:.08em;
    padding-left:100%; animation:tick linear infinite; color:var(--fg); }
  @keyframes tick { from { transform:translateX(0); } to { transform:translateX(-100%); } }

  /* セット面：広告を全画面で */
  body.set #welcome { display:none; }

  #status { position:absolute; left:calc(1 * var(--u)); bottom:calc(6 * var(--u)); font-size:calc(1.5 * var(--u));
    color:#e88; font-family:sans-serif; z-index:3; }
</style>
</head>
<body>
<div id="app">
  <section id="welcome">
    <div class="frame">
      <div class="clock" id="clock"></div>
      <div class="wtitle" id="wtitle">welcome</div>
      <div class="wsub" id="wsub"></div>
      <div class="heart">♥</div>
      <div class="wmsg" id="wmsg"></div>
      <div class="guests" id="guests"></div>
    </div>
  </section>
  <section id="stage"><div class="dots" id="dots"></div></section>
  <div id="ticker"><span id="tickerText"></span></div>
  <div id="status"></div>
</div>

<script>
/* ===== 設定（ここだけ書き換え） ===== */
const CONFIG = {
  // スプレッドシート連携のURL（apps-script.gs を公開した「ウェブアプリURL」）。空ならsample-data.jsonを表示
  api: 'https://script.google.com/macros/s/AKfycbz9fMSJpAKZdfYtiApso21Xz8QEW-cHXQOtD8PuVz7Y9knBLHhI1TTiltND3eTPyAHyNQ/exec',
  refreshSec: 60,        // データ再取得の間隔（秒）
  slideSec: 10,          // 画像・文字の広告1枚の表示秒数
  videoSec: 60,          // 動画の広告の表示秒数（広告ごとに「表示秒数」で上書き可）
  guestPageSec: 8,       // お客様名が多いときのページ切替秒数
  guestsPerPage: 8,      // 1ページに出すお客様の数
  hidePastMinutes: 60,   // 予約時刻からこの分数を過ぎたお名前は消す
  showTime: false,       // お名前の横に予約時刻を出すか（他のお客様にも見えるので通常はfalse）
  reloadHours: 6         // 長時間つけっぱなし対策で定期的にページを読み直す
};

/* ===== URLパラメータ（初回に付ければ端末に保存されます） =====
   screen=entrance（入口・既定） / screen=set（セット面）
   rotate=90 / 270 / 180 … テレビを縦置きにしたとき画面を回転（Fire TVは本体で回転できないため）
   store=店舗コード   key=合言葉 */
const P = new URLSearchParams(location.search);
['screen', 'rotate', 'store', 'key'].forEach(k => { if (P.get(k) !== null) localStorage.setItem('signage_' + k, P.get(k)); });
const opt = k => localStorage.getItem('signage_' + k) || '';
const SCREEN = opt('screen') === 'set' ? 'set' : 'entrance';
const ROT = [90, 180, 270].includes(+opt('rotate')) ? +opt('rotate') : 0;
const STORE = opt('store');
const KEY = opt('key');
document.body.classList.add(SCREEN);
if (ROT === 90 || ROT === 270) document.body.classList.add('portrait');

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const hm = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const WD = '日月火水木金土';

let data = null, lastJson = '', slideIdx = -1, guestPage = 0, slideTimer = null, shownKey = '';

/* ---- 画面の回転と大きさ ---- */
function layout() {
  const W = innerWidth, H = innerHeight, side = ROT === 90 || ROT === 270;
  const w = side ? H : W, h = side ? W : H;
  const app = $('app'), root = document.documentElement.style;
  app.style.width = w + 'px'; app.style.height = h + 'px';
  app.style.transform = { 0: '', 90: `translate(${W}px,0) rotate(90deg)`,
    180: `translate(${W}px,${H}px) rotate(180deg)`, 270: `translate(0,${H}px) rotate(270deg)` }[ROT];
  root.setProperty('--vw', w / 100 + 'px');
  root.setProperty('--vh', h / 100 + 'px');
  root.setProperty('--u', Math.min(w, h) / 100 + 'px');
}

/* ---- 時計 ---- */
function tickClock() {
  const d = new Date();
  $('clock').textContent = `${d.getMonth() + 1}/${d.getDate()}(${WD[d.getDay()]}) ${hm(d)}`;
}

/* ---- データ取得 ---- */
async function load() {
  try {
    const url = CONFIG.api
      ? `${CONFIG.api}?store=${encodeURIComponent(STORE)}&key=${encodeURIComponent(KEY)}&t=${Date.now()}`
      : `sample-data.json?t=${Date.now()}`;
    const r = await fetch(url, { cache: 'no-store' });
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    if (!CONFIG.api) d.date = ymd(new Date()); // お試し表示は常に「今日」扱い
    localStorage.setItem('signage_cache', JSON.stringify(d));
    apply(d);
    $('status').textContent = '';
  } catch (e) {
    console.warn(e);
    if (!data) { const c = localStorage.getItem('signage_cache'); if (c) apply(JSON.parse(c)); }
    $('status').textContent = '通信できません（前回のデータで表示中）';
  }
}

function apply(d) {
  const json = JSON.stringify(d);
  if (json === lastJson) return;
  lastJson = json; data = d;
  $('wtitle').textContent = d.welcomeTitle || 'welcome';
  $('wsub').textContent = d.welcomeSub || '';
  $('wmsg').textContent = d.welcome || '';
  const t = d.ticker || '';
  $('tickerText').textContent = t;
  $('tickerText').style.animationDuration = Math.max(15, t.length * 0.35) + 's';
  $('ticker').style.display = t ? '' : 'none';
  renderGuests();
}

/* ---- ウェルカムボード ---- */
function visibleGuests() {
  if (!data || data.date !== ymd(new Date())) return []; // 前日のデータは出さない
  const limit = hm(new Date(Date.now() - CONFIG.hidePastMinutes * 60000));
  return (data.guests || [])
    .filter(g => g.name && (!g.time || g.time >= limit))
    .sort((a, b) => (a.time || '').localeCompare(b.time || ''));
}

function renderGuests() {
  if (SCREEN !== 'entrance') return;
  const list = visibleGuests();
  const box = $('guests');
  if (!list.length) {
    box.innerHTML = `<div class="noguest">${esc(data?.noGuestMessage || '')}</div>`;
    return;
  }
  const pages = Math.ceil(list.length / CONFIG.guestsPerPage);
  guestPage = guestPage % pages;
  const now = hm(new Date());
  const nextTime = (list.find(g => g.time && g.time >= now) || {}).time;
  box.innerHTML = list
    .slice(guestPage * CONFIG.guestsPerPage, (guestPage + 1) * CONFIG.guestsPerPage)
    .map(g => `<div class="guest${g.time && g.time === nextTime ? ' next' : ''}">` +
      (CONFIG.showTime && g.time ? `<span class="time">${esc(g.time)}</span>` : '') +
      `${esc(g.name)}<span class="sama">様</span></div>`).join('');
}

function nextGuestPage() {
  const n = Math.ceil(visibleGuests().length / CONFIG.guestsPerPage);
  if (n <= 1) { renderGuests(); return; }
  $('guests').style.opacity = 0;
  setTimeout(() => { guestPage = (guestPage + 1) % n; renderGuests(); $('guests').style.opacity = 1; }, 800);
}

/* ---- 広告スライド ---- */
function isActive(s) {
  const now = new Date(), today = ymd(now), t = hm(now);
  if (!s.title && !s.image && !youtubeId(s.video)) return false; // 中身のない行は出さない
  const where = s.screen || 'both';
  if (where !== 'both' && where !== SCREEN) return false;
  if (s.start && today < s.start) return false;
  if (s.end && today > s.end) return false;
  if (s.days && !s.days.includes(WD[now.getDay()])) return false;
  if (s.hours) {
    const [a, b] = s.hours.split('-').map(x => x.trim());
    if ((a && t < a) || (b && t >= b)) return false;
  }
  return true;
}

function youtubeId(url) {
  const m = String(url || '').match(/(?:youtu\.be\/|v=|\/embed\/|\/shorts\/|\/live\/)([\w-]{11})/);
  return m ? m[1] : '';
}

function slideHtml(s) {
  const vid = youtubeId(s.video);
  if (vid) {
    const src = `https://www.youtube.com/embed/${vid}?autoplay=1&mute=1&loop=1&playlist=${vid}&controls=0&rel=0&playsinline=1&modestbranding=1`;
    return { cls: 'slide', bg: '#000', html: `<iframe src="${src}" allow="autoplay; encrypted-media"></iframe>` +
      (s.title ? `<div class="shade"></div><div class="inner"><h2>${esc(s.title)}</h2><p>${esc(s.body)}</p></div>` : '') };
  }
  if (s.image) {
    return { cls: 'slide', bg: `#000 url("${encodeURI(s.image)}") center/cover no-repeat`,
      html: (s.title || s.body) ? `<div class="shade"></div><div class="inner"><h2>${esc(s.title)}</h2><p>${esc(s.body)}</p></div>` : '' };
  }
  return { cls: 'slide text', bg: s.bg || 'radial-gradient(ellipse at 50% 40%,#2c2620,#0d0c0b 75%)',
    html: `<div class="inner"><h2>${esc(s.title)}</h2><p>${esc(s.body)}</p></div>` };
}

function nextSlide() {
  clearTimeout(slideTimer);
  const list = (data?.slides || []).filter(isActive);
  let wait = CONFIG.slideSec;
  if (list.length) {
    slideIdx = (slideIdx + 1) % list.length;
    const s = list[slideIdx];
    wait = +s.sec || (youtubeId(s.video) ? CONFIG.videoSec : CONFIG.slideSec);
    const key = JSON.stringify(s);
    if (key !== shownKey) {          // 同じ1枚だけなら作り直さない（動画が途切れないように）
      shownKey = key;
      const stage = $('stage'), v = slideHtml(s);
      const el = document.createElement('div');
      el.className = v.cls; el.style.background = v.bg; el.innerHTML = v.html;
      stage.insertBefore(el, $('dots'));
      void el.offsetWidth;
      el.classList.add('on');
      [...stage.querySelectorAll('.slide')].slice(0, -1).forEach(old => {
        old.classList.remove('on'); setTimeout(() => old.remove(), 1300);
      });
    }
    $('dots').innerHTML = list.length > 1 ? list.map((_, i) => `<i class="${i === slideIdx ? 'on' : ''}"></i>`).join('') : '';
  }
  slideTimer = setTimeout(nextSlide, wait * 1000);
}

/* ---- 起動 ---- */
layout(); addEventListener('resize', layout);
tickClock(); setInterval(tickClock, 1000);
load().then(nextSlide);
setInterval(load, CONFIG.refreshSec * 1000);
setInterval(nextGuestPage, CONFIG.guestPageSec * 1000);
setTimeout(() => { if (navigator.onLine) location.reload(); }, CONFIG.reloadHours * 3600000);
</script>
</body>
</html>
